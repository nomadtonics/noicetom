[workspace]
members = ["desktop"]
resolver = "2"

[package]
name = "noicetom"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "noicetom"
path = "src/lib.rs"

[[bin]]
name = "noicetom"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.9", features = ["serde", "v4"] }
rand = "0.8"
dirs = "5"
aes-gcm = "0.10"
base64 = "0.21"
tower-http = { version = "0.5", features = ["trace", "cors"] }

[dev-dependencies]
hyper = { version = "1.0", features = ["client", "http1"] }
