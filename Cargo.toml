[package]
name = "noicetom"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7" }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.9", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
anyhow = "1.0"
base64 = "0.21"
ed25519-dalek = "1.0"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
rusqlite = { version = "0.29", features = ["bundled"] }

[dev-dependencies]
# none for now

[profile.release]
opt-level = 3
